<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Panel — Apna Electric One</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#10b981">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apna Electric">
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a class="brand" href="index.html">
            <i class="fas fa-bolt"></i>
            <div>Apna Electric One<small>Driver Panel</small></div>
        </a>
        <div class="nav-links">
            <a href="shop.html"><i class="fas fa-cart-shopping"></i> Shop EV</a>
            <a href="index.html">Book Ride</a>
            <a href="driver.html" class="active">Driver</a>
            <a href="admin.html">Admin</a>
            <a href="settings.html">Settings</a>
            <a href="#" onclick="Drv.logout(); return false;">Logout</a>
        </div>
    </div>
</nav>

<!-- LOGIN -->
<div id="loginView" class="drv-shell" style="max-width:420px;padding-top:48px">
    <div class="card">
        <div class="card-head"><h3><i class="fas fa-right-to-bracket" style="color:var(--brand)"></i> Driver Login</h3></div>
        <div class="card-body">
            <div class="form-group">
                <label>Driver ID</label>
                <input class="form-control" id="drvId" placeholder="DRV001" value="DRV001">
            </div>
            <div class="form-group">
                <label>PIN</label>
                <input type="password" class="form-control" id="drvPin" placeholder="1234" value="1234">
            </div>
            <button class="btn btn-primary btn-block" onclick="Drv.login()">
                <i class="fas fa-bolt"></i> Login
            </button>
            <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:12px">
                Demo: koi bhi DRV001–DRV008 · PIN <strong>1234</strong>
            </p>
        </div>
    </div>
</div>

<!-- PANEL -->
<div id="panelView" class="drv-shell" style="display:none">
    <div class="online-toggle">
        <div>
            <div class="ot-label">STATUS</div>
            <div class="ot-state" id="otState">Offline</div>
        </div>
        <label class="switch">
            <input type="checkbox" id="onlineSw" onchange="Drv.toggleOnline(this.checked)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="stats-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-route"></i></div><div><div class="stat-value" id="sTrips">0</div><div class="stat-label">Trips</div></div></div>
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-indian-rupee-sign"></i></div><div><div class="stat-value" id="sEarn">₹0</div><div class="stat-label">Earnings</div></div></div>
    </div>

    <div class="card" style="margin-bottom:16px">
        <div class="card-head"><h3><i class="fas fa-id-card" style="color:var(--brand)"></i> My Profile</h3></div>
        <div class="card-body" id="profileBox"></div>
    </div>

    <div id="requestArea"></div>

    <div class="card" style="margin-top:16px">
        <div class="card-head"><h3>My Trips</h3></div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Ride</th><th>Route</th><th>Fare</th><th>Status</th></tr></thead>
                <tbody id="drvTrips"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="assets/data.js"></script>
<script src="assets/firebase.js"></script>
<script src="assets/driver.js"></script>
<script src="assets/auth.js"></script>
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function (e) { console.warn('SW', e); });
    });
}
</script>
</body>
</html>
